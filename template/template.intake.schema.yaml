# Build It Factory — Template Intake Schema
# Feeds the Build It Intake Form. Derived from sitemap.yaml and template.manifest.yaml.
# Every required React content location has a corresponding intake source.
# Unnecessary fields are avoided; only required information is collected.

schema_version: 1.0.0
description: >
  Intake schema for the ELEC-PREIMIUM-ELECTRONICS-B5 template (E2 – Premium Electronics & Accessories).
  Maps client-provided data to page sections across all 25 sitemap pages.
  Destination format follows the example: <PagePascalCase>.<SectionPascalCase>.<field>.

pages:

  home:
    hero:
      - field_id: hero_title
        field_name: Hero Title
        type: string
        required: true
        purpose: The main heading on the home page
        destination: Home.Hero.heading
      - field_id: hero_subtitle
        field_name: Hero Subtitle
        type: string
        required: false
        purpose: Subheading under the hero title
        destination: Home.Hero.subheading
      - field_id: hero_image
        field_name: Hero Image
        type: url
        required: true
        purpose: Main hero background image URL
        destination: Home.Hero.image
      - field_id: cta_primary_text
        field_name: Primary CTA Text
        type: string
        required: true
        purpose: Primary call-to-action button label
        destination: Home.Hero.cta_primary
      - field_id: cta_primary_url
        field_name: Primary CTA URL
        type: string
        required: true
        purpose: Link destination for primary CTA
        destination: Home.Hero.cta_url
      - field_id: secondary_cta_text
        field_name: Secondary CTA Text
        type: string
        required: false
        purpose: Secondary link label (e.g. "Explore Products")
        destination: Home.Hero.cta_secondary
      - field_id: secondary_cta_url
        field_name: Secondary CTA URL
        type: string
        required: false
        purpose: Link destination for secondary CTA
        destination: Home.Hero.cta_secondary_url
      - field_id: lifestyle_editorial_title
        field_name: Lifestyle Editorial Title
        type: string
        required: true
        purpose: Title for the lifestyle/editorial section
        destination: Home.LifestyleEditorial.title
      - field_id: lifestyle_editorial_image
        field_name: Lifestyle Editorial Image
        type: url
        required: true
        purpose: Hero image for the lifestyle section
        destination: Home.LifestyleEditorial.image
      - field_id: customer_benefits_title
        field_name: Customer Benefits Title
        type: string
        required: true
        purpose: Title reinforcing trust (warranty, support, policies)
        destination: Home.CustomerBenefits.title
      - field_id: support_section_title
        field_name: Support Section Title
        type: string
        required: true
        purpose: Title for the support section
        destination: Home.SupportSection.title
      - field_id: newsletter_title
        field_name: Newsletter Title
        type: string
        required: false
        purpose: Title above the newsletter form
        destination: Home.Newsletter.title
      - field_id: newsletter_cta_text
        field_name: Newsletter CTA Text
        type: string
        required: true
        purpose: Primary button text for subscription
        destination: Home.Newsletter.cta
      - field_id: newsletter_placeholder_email
        field_name: Newsletter Email Placeholder
        type: string
        required: false
        purpose: Placeholder text in the email input field
        destination: Home.Newsletter.placeholder
      - field_id: footer_nav_home
        field_name: Footer Nav Home
        type: string
        required: false
        purpose: Label for "Home" link in footer
        destination: Home.FooterNav.home
      - field_id: footer_nav_terms
        field_name: Footer Nav Terms
        type: string
        required: false
        purpose: Label for "Terms" link in footer
        destination: Home.FooterNav.terms
      - field_id: footer_nav_privacy
        field_name: Footer Nav Privacy
        type: string
        required: false
        purpose: Label for "Privacy" link in footer
        destination: Home.FooterNav.privacy

    shop_by_category:
