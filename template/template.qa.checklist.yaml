# ===========================================================================
# 6. TECHNICAL REQUIREMENTS
# Trace: template.manifest.yaml (stack, version), SOP (build instructions)
# ===========================================================================

technical:
  # --- STACK (manifest stack) ---
  - check: "package.json declares next 16.3.1, react 19.2.8, typescript ^5,
    tailwindcss ^4, clsx — source: manifest stack section"
  - check: "Path alias @/* → ./app/* configured in tsconfig.json —
    source: manifest stack + SOP §1.2"

  # --- BUILD & VERIFICATION (SOP §3) ---
  - check: "`node scripts/validate-content.mjs` exits 0 (127/127 destinations)
    — source: SOP §3.3"
  - check: "`npx next build` succeeds: compiled, TypeScript passes, 25 routes
    emitted (23 static + 2 dynamic) — source: SOP §3.4"
  - check: "`npx next start` serves HTTP 200 on all 24 checked routes —
    source: SOP §3.5"
  - check: "`npm run lint` passes with zero errors — source: SOP §3.7"

  # --- VERSION CONSISTENCY (SOP §6.9 + manifest) ---
  - check: "template.manifest.yaml version = 1.0.0 — source: manifest"
  - check: "template.intake.schema.yaml schema_version = 1.0.0 — source: intake schema"
  - check: "template.content.mapping.json version = 1.0.0 — source: content mapping"
  - check: "package.json version = 0.1.0 (implementation reference) — source: package.json"
  - check: "No version mismatches across artifacts — source: SOP §6"

  # --- CODE QUALITY (SOP §6 + agent instructions) ---
  - check: "No client-specific content hardcoded in pages/components; all
    copy/assets flow through content objects and assetImage() — source:
    manifest objective + SOP §6.5"
  - check: "Every react_component referenced in the content mapping exists
    as a typed .tsx file in app/components/ — source: content mapping
    react_component values"
  - check: "Dynamic routes type their params: app/product/[id]/page.tsx and
    app/shop/[category]/page.tsx — source: SOP §2.2"
  - check: "No orphan empty component directories shadow real components
    (button/, container/, cta/, footer/, gallery/, hero/, navbar/,
    service-section/, testimonials/, typography/ are empty and unused) —
    source: SOP §1.3 component inventory"
  - check: "next.config.ts images.remotePatterns allows images.unsplash.com;
    no invalid config keys — source: SOP §2.4"

